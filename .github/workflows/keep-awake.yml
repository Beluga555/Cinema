name: Не даём базе уснуть
# Бесплатный Supabase засыпает после недели без запросов.
# Раз в день дёргаем базу коротким запросом, чтобы она оставалась живой.
on:
  schedule:
    - cron: "17 2 * * *"   # каждый день в 12:17 по Хабаровску
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос к базе
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://blzdhvctwrkamvayylrr.supabase.co/rest/v1/movies?select=kp_id&limit=1" \
            -H "apikey: sb_publishable_YjNiD8hhkHcfRe6wcugaHg_iPNf4ieP")
          echo "Ответ базы: $code"
          [ "$code" -lt 500 ] || exit 1
      - name: Сайт открывается
        run: |
          html=$(curl -s -L "https://beluga555.github.io/Cinema/")
          echo "$html" | grep -q "Наше кино" && echo "Сайт на месте" || { echo "Сайт не открылся или пустой"; exit 1; }
