<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наше кино</title>
<link href="https://fonts.googleapis.com/css2?family=Kelly+Slab&family=Marck+Script&family=PT+Serif:ital@0;1&family=PT+Sans:wght@400;700&family=Rubik+Wet+Paint&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b0908; --smoke:#17110f; --wood:#2a1813;
  --paper:#eee0c1; --paper2:#dcc69a; --ink:#2b1a14; --ink2:#6b4a3a;
  --red:#9c1a20; --red2:#c2272c; --gold:#c8963e; --gold2:#e9c77c; --bone:#f4ebd9; --pumpkin:#d5651e;
  --muted:#a8968a;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;color:var(--bone);font:15px/1.5 'PT Sans',system-ui,sans-serif;
  background:
    radial-gradient(420px 420px at 82% 120px, rgba(244,235,217,.10), transparent 60%),
    radial-gradient(1200px 600px at 50% 0, #1f1512, transparent 70%),
    var(--night);
  min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- шатёр ---------- */
.tent{height:58px;background:
   linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 60%),
   repeating-linear-gradient(90deg,var(--red) 0 46px,var(--bone) 46px 92px)}
.flaps{height:23px;background:repeating-linear-gradient(90deg,var(--red) 0 46px,var(--bone) 46px 92px);
  -webkit-mask:radial-gradient(circle at 50% 0,#000 22.5px,#0000 23px) 0 0/46px 23px repeat-x;
          mask:radial-gradient(circle at 50% 0,#000 22.5px,#0000 23px) 0 0/46px 23px repeat-x;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.garland{height:16px;margin-top:-4px;display:flex;justify-content:space-around;overflow:hidden}
.garland i,.sign .bulb{width:8px;height:8px;border-radius:50%;background:#ffe3a3;box-shadow:0 0 8px 2px rgba(255,190,100,.55)}
.garland i.dead,.sign .bulb.dead{background:#5a4636;box-shadow:none}
.garland i.fl,.sign .bulb.fl{animation:flick 3.2s infinite steps(1)}
@keyframes flick{0%,100%{opacity:1}7%{opacity:.2}9%{opacity:1}53%{opacity:.35}55%{opacity:1}}

/* ---------- ночь и силуэты ---------- */
.hero{position:relative;padding:26px 16px 0;text-align:center}
.moon{position:absolute;right:9%;top:18px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f7eed8,#cfc2a6 70%);box-shadow:0 0 60px 10px rgba(244,235,217,.12);opacity:.85}
.bat{position:absolute;width:34px;fill:#050404;opacity:.9;animation:batfly 18s linear infinite}
.bat.b2{width:22px;animation-duration:24s;animation-delay:-8s;top:70px}
.bat.b3{width:18px;animation-duration:30s;animation-delay:-15s;top:40px}
@keyframes batfly{0%{transform:translate(-10vw,30px)}50%{transform:translate(50vw,-10px)}100%{transform:translate(110vw,20px)}}

/* ---------- вывеска ---------- */
.sign{position:relative;display:inline-block;padding:22px 40px 18px;margin-top:6px;
  background:linear-gradient(180deg,#7d1318,#5a0d11);border:3px solid var(--gold);border-radius:14px 14px 10px 10px;
  box-shadow:0 0 0 6px var(--wood),0 0 0 8px var(--gold),0 20px 40px rgba(0,0,0,.6)}
.sign .row{position:absolute;left:14px;right:14px;display:flex;justify-content:space-between}
.sign .row.top{top:7px}.sign .row.bot{bottom:7px}
.sign .pre{display:block;font:22px/1 'Yeseva One',serif;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase}
.sign .main{display:block;font:64px/1 'Rubik Wet Paint',cursive;color:var(--bone);text-shadow:0 3px 0 #3a0709;margin-top:4px}
.sign .sub{display:block;font:14px/1 'Kelly Slab';color:var(--gold2);letter-spacing:.3em;margin-top:6px}

/* силуэты ярмарки + туман */
.skyline{display:block;width:100%;height:120px;margin-top:-30px;fill:#050403}
.fog{position:relative;height:0}
.fog::before{content:"";position:absolute;left:-20%;right:-20%;top:-60px;height:90px;
  background:radial-gradient(40% 60% at 30% 60%,rgba(200,190,175,.10),transparent 70%),radial-gradient(35% 55% at 75% 50%,rgba(200,190,175,.08),transparent 70%);
  animation:fog 22s ease-in-out infinite alternate;pointer-events:none}
@keyframes fog{to{transform:translateX(8%)}}

/* ---------- таблички-меню ---------- */
nav{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:6px 16px 0;position:relative;z-index:2}
.plank{position:relative;background:linear-gradient(180deg,#3a2419,#26160f);border:2px solid #5a3a28;border-radius:6px;
  padding:10px 18px 9px;font:18px/1 'Kelly Slab';color:var(--paper2);letter-spacing:.06em;box-shadow:0 8px 16px rgba(0,0,0,.5);transform-origin:50% -18px}
.plank::before,.plank::after{content:"";position:absolute;top:-18px;width:2px;height:18px;background:repeating-linear-gradient(180deg,#8a7a6a 0 3px,transparent 3px 5px)}
.plank::before{left:18%}.plank::after{right:18%}
.plank small{font-size:13px;color:var(--gold);margin-left:6px}
.plank.on{color:var(--bone);border-color:var(--gold);box-shadow:0 8px 16px rgba(0,0,0,.5),0 0 18px rgba(233,199,124,.35);animation:swing 3s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}

main{max-width:1180px;margin:0 auto;padding:30px 16px 80px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h2{margin:0;font:34px/1.1 'Yeseva One',serif;color:var(--bone)}
h2 em{font-style:normal;color:var(--red2)}
.sorts{display:flex;gap:8px;font:13px 'Kelly Slab'}
.sorts button{background:none;border:1px dashed #5a4636;border-radius:20px;padding:5px 12px;color:var(--muted)}
.sorts button.on{border-style:solid;border-color:var(--gold);color:var(--gold2)}

/* ---------- билеты ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:28px 34px}
.ticket{display:flex;height:196px;cursor:pointer;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55));transition:transform .2s;padding-right:22px}
.ticket:hover{transform:translateY(-3px) rotate(-.4deg)}
.t-main,.t-stub{position:relative}
.t-main{flex:1;min-width:0;display:flex;
  background:
    radial-gradient(60px 40px at 80% 85%,rgba(120,70,30,.18),transparent 70%),
    radial-gradient(90px 50px at 15% 10%,rgba(120,70,30,.12),transparent 70%),
    linear-gradient(135deg,var(--paper),var(--paper2));
  color:var(--ink);
  -webkit-mask:radial-gradient(circle at 100% 0,#0000 13px,#000 13.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,#0000 13px,#000 13.5px) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle at 100% 0,#0000 13px,#000 13.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,#0000 13px,#000 13.5px) bottom/100% 51% no-repeat}
.t-main::before{content:"";position:absolute;inset:8px;border:2px solid var(--gold);border-radius:6px;pointer-events:none}
.t-main::after{content:"";position:absolute;inset:13px;border:1px solid rgba(200,150,62,.5);border-radius:4px;pointer-events:none}
.t-stub{width:140px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 8px;color:var(--bone);
  background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.3)),repeating-linear-gradient(90deg,var(--red) 0 14px,#841519 14px 28px);
  -webkit-mask:radial-gradient(circle at 0 0,#0000 13px,#000 13.5px) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,#0000 13px,#000 13.5px) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle at 0 0,#0000 13px,#000 13.5px) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,#0000 13px,#000 13.5px) bottom/100% 51% no-repeat}
.perf{position:absolute;right:0;top:16px;bottom:16px;border-right:2px dashed rgba(107,74,58,.55)}
.poster{width:112px;flex:none;margin:16px 0 16px 16px;border-radius:4px;background:#3a2a22 center/cover no-repeat;box-shadow:0 0 0 2px var(--gold),inset 0 0 20px rgba(0,0,0,.3);filter:sepia(.18) contrast(1.02)}
.t-body{flex:1;min-width:0;padding:18px 20px 16px 16px;display:flex;flex-direction:column}
.kick{font:12px/1 'Kelly Slab';letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.title{font:26px/1.05 'Yeseva One',serif;color:var(--red);margin:7px 0 3px;overflow-wrap:break-word;hyphens:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--ink2)}
.foot{margin-top:auto;display:flex;justify-content:space-between;font:12px 'Kelly Slab';letter-spacing:.1em;color:var(--ink2)}
.stamps{display:flex;gap:10px;margin:2px 0 20px}
.stamp{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;position:relative;
  font:22px/1 'Yeseva One',serif;border:2px solid currentColor;outline:1px solid currentColor;outline-offset:3px;transform:rotate(-8deg)}
.stamp:nth-child(2){transform:rotate(7deg)}
.stamp small{position:absolute;bottom:-19px;font:11px/1 'Kelly Slab';letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.stamp.v{color:var(--gold2)} .stamp.n{color:var(--bone)} .stamp.empty{opacity:.45}
.date{font:12px/1.2 'Kelly Slab';letter-spacing:.08em;color:var(--paper2)}
.date b{display:block;font:17px/1.2 'Kelly Slab';color:var(--bone);letter-spacing:.06em}
.void{font:14px/1.2 'Kelly Slab';letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
.used{position:absolute;right:30px;bottom:34px;font:13px 'Kelly Slab';letter-spacing:.18em;color:var(--red2);border:2px solid var(--red2);padding:3px 8px;transform:rotate(-10deg);opacity:.75}
/* оторванный */
.torn .t-main{clip-path:polygon(0 0,100% 0,97% 6%,100% 12%,97% 18%,100% 24%,97% 30%,100% 36%,97% 42%,100% 48%,97% 54%,100% 60%,97% 66%,100% 72%,97% 78%,100% 84%,97% 90%,100% 96%,100% 100%,0 100%)}
.torn .t-stub{clip-path:polygon(4% 0,100% 0,100% 100%,4% 100%,0 96%,4% 90%,0 84%,4% 78%,0 72%,4% 66%,0 60%,4% 54%,0 48%,4% 42%,0 36%,4% 30%,0 24%,4% 18%,0 12%,4% 6%);transform:translate(16px,10px) rotate(6deg)}
.torn .perf{display:none}

/* ---------- касса (поиск и вход) ---------- */
.booth{max-width:640px;margin:0 auto 34px;position:relative;background:linear-gradient(180deg,#3a2419,#221410);border:3px solid var(--gold);border-radius:18px 18px 10px 10px;padding:24px 22px 22px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.booth .roof{position:absolute;left:-3px;right:-3px;top:-34px;height:34px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,var(--red) 0 30px,var(--bone) 30px 60px);border:3px solid var(--gold);border-bottom:0}
.booth h3{margin:0 0 4px;font:30px/1.1 'Yeseva One',serif;color:var(--gold2)}
.booth p{margin:0 0 16px;color:var(--muted);font-size:14px}
.window{display:flex;gap:10px;background:#0f0a08;border:2px solid #5a3a28;border-radius:40px 40px 10px 10px;padding:16px}
.window input{flex:1;min-width:0;background:var(--paper);color:var(--ink);border:0;border-radius:6px;padding:12px 14px;outline:none;font-family:'Kelly Slab';font-size:17px}
.btn{background:var(--red2);color:var(--bone);border:2px solid var(--gold);border-radius:8px;padding:10px 18px;font:17px 'Kelly Slab';letter-spacing:.06em;box-shadow:0 4px 0 #5a0d11}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #5a0d11}
.btn.ghost{background:transparent;color:var(--gold2)}
.actions{display:flex;gap:8px;margin-top:auto}
.actions .btn{font-size:14px;padding:6px 10px;box-shadow:0 3px 0 #5a0d11}
.actions .btn.ghost{color:var(--red);border-color:var(--red);box-shadow:none}
.login{max-width:420px}
.login .window{flex-direction:column}
.login .window input{font-family:'PT Sans';font-size:15px}

/* ---------- закрыто ---------- */
.closed{text-align:center;padding:40px 16px}
.closed .board{display:inline-block;background:linear-gradient(180deg,#3a2419,#26160f);border:2px solid #5a3a28;padding:20px 30px;transform:rotate(-3deg);box-shadow:0 12px 24px rgba(0,0,0,.5)}
.closed .board b{display:block;font:44px/1 'Rubik Wet Paint',cursive;color:var(--red2)}
.closed .board span{font:16px 'Kelly Slab';color:var(--paper2);letter-spacing:.08em}

/* ---------- карточка-афиша ---------- */
dialog{border:0;padding:0;background:transparent;color:var(--bone);width:min(860px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto}
dialog::backdrop{background:rgba(5,4,3,.82)}
.afisha{position:relative;background:
   radial-gradient(160px 90px at 88% 90%,rgba(120,70,30,.2),transparent 70%),
   linear-gradient(135deg,var(--paper),var(--paper2));color:var(--ink);border-radius:8px;padding:26px;display:grid;grid-template-columns:230px 1fr;gap:24px;box-shadow:0 0 0 6px var(--wood),0 0 0 8px var(--gold)}
.afisha::before{content:"";position:absolute;inset:10px;border:2px solid var(--gold);border-radius:4px;pointer-events:none}
.afisha .big{aspect-ratio:2/3;border-radius:4px;background:#3a2a22 center/cover no-repeat;box-shadow:0 0 0 3px var(--gold),0 0 0 7px var(--red)}
.afisha h3{margin:0;font:36px/1.05 'Yeseva One',serif;color:var(--red)}
.afisha .meta{margin:6px 0 12px}
.afisha .desc{font-size:14px;color:#4a3528;max-height:110px;overflow:auto}
.close{position:absolute;right:16px;top:12px;background:none;border:0;font-size:30px;color:var(--red);z-index:2}
.mine{margin-top:16px;padding-top:14px;border-top:2px dashed rgba(107,74,58,.5)}
.mine .lbl{font:14px 'Kelly Slab';letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.nums{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.nums button{width:38px;height:38px;border:2px solid var(--ink2);background:transparent;color:var(--ink);border-radius:50%;font:17px 'Yeseva One',serif}
.nums button.on{background:var(--red);border-color:var(--red);color:var(--bone);transform:rotate(-8deg)}
.mine textarea{width:100%;min-height:86px;resize:vertical;border:0;outline:none;padding:10px 12px;color:var(--ink);border-radius:4px;
  background:repeating-linear-gradient(180deg,#f7eedb 0 25px,#d9c7a4 25px 26px);font:15px/26px 'PT Sans'}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row2 input[type=date]{border:2px solid var(--ink2);background:transparent;border-radius:6px;padding:6px 8px;color:var(--ink)}
.other{margin-top:14px;background:rgba(156,26,32,.08);border-left:3px solid var(--red);padding:10px 12px;font-size:14px}
.other b{font-family:'Kelly Slab';letter-spacing:.08em}
/* ---------- карточка: подробности о фильме ---------- */
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 12px}
.facts span{position:relative;font:13px/1 'Kelly Slab';letter-spacing:.06em;padding:6px 12px 5px;background:var(--ink);color:var(--gold2);
  -webkit-mask:radial-gradient(circle 4px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 4px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 4px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 4px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.facts span.r{background:var(--red);color:var(--bone)}
.slogan{position:relative;font:italic 17px/1.35 'PT Serif',serif;color:var(--red);margin:0 0 12px;padding-left:14px;border-left:3px double var(--gold)}
.xtra{grid-column:1/-1;display:flex;flex-direction:column;gap:26px;padding-top:20px;border-top:2px dashed rgba(107,74,58,.5)}
.xtra .muted{font-size:13px;color:var(--ink2)}
/* заголовок раздела: лента с хвостами */
.xh{display:flex;align-items:center;gap:12px;margin:0 0 14px;font:15px/1 'Kelly Slab';letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.xh::before,.xh::after{content:"";flex:1;height:8px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 14px);opacity:.55;border-radius:2px}
.xh b{background:var(--red);color:var(--bone);font-weight:400;padding:7px 18px 6px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
/* трейлер: сцена с занавесом и лампочками */
.x-stage{position:relative;padding:22px 34px 18px;border-radius:10px 10px 4px 4px;
  background:radial-gradient(120% 70% at 50% 0,#3b0c0f,#1a0708 70%);box-shadow:0 0 0 3px var(--gold),0 0 0 7px var(--wood),0 14px 30px rgba(0,0,0,.35)}
.x-stage::before,.x-stage::after{content:"";position:absolute;top:0;bottom:0;width:30px;z-index:1;
  background:repeating-linear-gradient(90deg,#8f171d 0 6px,#6e0f13 6px 10px,#b5232a 10px 13px);box-shadow:inset 0 -20px 30px rgba(0,0,0,.45)}
.x-stage::before{left:0;border-radius:10px 0 0 4px}.x-stage::after{right:0;border-radius:0 10px 4px 0}
.x-stage .bulbs{position:absolute;left:34px;right:34px;top:7px;display:flex;justify-content:space-between}
.x-stage .bulbs i{width:7px;height:7px;border-radius:50%;background:#ffe3a3;box-shadow:0 0 7px 2px rgba(255,190,100,.6);animation:flick 3.2s infinite steps(1)}
.x-stage .bulbs i:nth-child(3n){animation-delay:1.1s}.x-stage .bulbs i:nth-child(4n){animation-delay:2.3s}
.screen{position:relative;aspect-ratio:16/9;background:#000 center/cover no-repeat;overflow:hidden;box-shadow:0 0 0 2px #000,0 0 40px rgba(255,220,160,.12)}
.screen video{position:absolute;inset:0;width:100%;height:100%;background:#000;display:none}
.screen.on video{display:block}
.screen .play{position:absolute;inset:0;border:0;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.05),rgba(0,0,0,.55) 75%)}
.screen.on .play{display:none}
.screen .play span{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--red);box-shadow:0 0 0 4px var(--gold2),0 0 0 8px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.6);transition:transform .15s}
.screen .play span::after{content:"";margin-left:7px;border-style:solid;border-width:16px 0 16px 26px;border-color:transparent transparent transparent var(--bone)}
.screen .play:hover span,.screen .play:focus-visible span{transform:scale(1.08)}
.screen .play:focus-visible{outline:3px solid var(--gold2);outline-offset:-3px}
.screen .play em{position:absolute;bottom:12px;left:0;right:0;text-align:center;font:13px 'Kelly Slab';letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);font-style:normal;text-shadow:0 2px 4px #000}
.x-stage .src{position:relative;z-index:2;margin-top:10px;text-align:center;font:12px 'Kelly Slab';letter-spacing:.14em;text-transform:uppercase;color:rgba(233,199,124,.7)}
.x-yt{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;min-height:120px;color:var(--gold2);font:16px 'Kelly Slab';letter-spacing:.12em;text-transform:uppercase;background:#000 center/cover no-repeat}
.x-yt span{background:rgba(0,0,0,.6);padding:10px 16px;border:2px solid var(--gold2);border-radius:6px}
/* сеансы: отрывные билетики */
.xtra .sh-days{gap:10px}
.xtra .sh-day{font:14px 'Kelly Slab';letter-spacing:.12em;color:var(--ink2)}
.xtra .sh-times{gap:10px}
.xtra .sh-btn{position:relative;flex-direction:row;align-items:stretch;padding:0;min-width:0;border:0;border-radius:4px;background:var(--bone);color:var(--ink);box-shadow:0 3px 0 rgba(43,26,20,.25),0 0 0 1.5px rgba(107,74,58,.45);overflow:hidden;transition:transform .15s,box-shadow .15s}
.xtra .sh-btn b{display:grid;place-items:center;padding:8px 12px;background:var(--red);color:var(--bone);font:19px 'Yeseva One',serif;border-right:2px dashed var(--bone)}
.xtra .sh-btn.mc b{background:#1e3b3d}
.xtra .sh-btn small{display:flex;flex-direction:column;justify-content:center;padding:6px 10px;margin:0;font-size:11.5px;line-height:1.3;color:var(--ink2);text-align:left}
.xtra .sh-btn small i{font-style:normal;font:12.5px 'Kelly Slab';letter-spacing:.06em;color:var(--ink)}
.xtra .sh-btn:hover,.xtra .sh-btn:focus-visible{transform:translateY(-2px) rotate(-1deg);box-shadow:0 6px 0 rgba(43,26,20,.25),0 0 0 2px var(--gold);background:var(--bone)}
.xtra .sh-btn:hover small,.xtra .sh-btn:focus-visible small{color:var(--ink2)}
/* актёры: медальоны */
.x-dir{margin:0 0 16px;text-align:center;font:15px 'PT Serif',serif;color:var(--ink2)}
.x-dir b{display:block;margin-top:2px;font:24px/1.1 'Yeseva One',serif;color:var(--ink);font-weight:400}
.x-cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:18px 12px}
.x-cast figure{margin:0;text-align:center}
.x-cast .ph{width:88px;height:108px;margin:0 auto;border-radius:50%;background:#cdb894 center 20%/cover no-repeat;filter:sepia(.35) contrast(1.05);

@media (max-width:640px){.x-stage{padding:20px 22px 14px}.x-stage::before,.x-stage::after{width:18px}.x-stage .bulbs{left:22px;right:22px}.screen .play span{width:64px;height:64px}}

/* ---------- фильтры ---------- */
.filters{display:flex;flex-direction:column;gap:10px;margin:0 0 26px;padding:14px 16px;background:linear-gradient(180deg,#1f1612,#170f0c);border:1px solid #4a3224;border-radius:10px}

          mask:radial-gradient(circle at 0 50%,#0000 4px,#000 4.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 4px,#000 4.5px) right/51% 100% no-repeat}

/* ---------- гашение: ачивка ---------- */
.ach{position:fixed;inset:0;z-index:50;display:none;place-items:center;overflow:hidden;
  background:radial-gradient(420px 520px at 50% 40%,rgba(255,220,150,.14),transparent 70%),rgba(5,4,3,.96);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}

  background:conic-gradient(from 160deg at 50% 0,transparent 0deg,rgba(255,230,170,.10) 18deg,transparent 40deg);animation:spot 2.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes spot{from{transform:translateX(-52%) rotate(-3deg)}to{transform:translateX(-48%) rotate(3deg)}}
.ach .ring{position:absolute;inset:14px;border-radius:16px;pointer-events:none}
.ach .ring i{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffe3a3;box-shadow:0 0 12px 3px rgba(255,190,100,.7);opacity:.2}
.ach.go .ring i{animation:chase 1.1s linear infinite}
@keyframes chase{0%,100%{opacity:.15}10%{opacity:1}30%{opacity:.15}}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:16px}
.bigt{position:relative;display:flex;height:210px;width:min(560px,92vw);transform:scale(.3) translateY(80px);opacity:0;filter:drop-shadow(0 20px 40px rgba(0,0,0,.7))}
.ach.go .bigt{animation:tin .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes tin{to{transform:none;opacity:1}}
.bigt .t-main{flex:1}
.bigt .t-stub{width:150px;transition:transform .6s cubic-bezier(.3,1.6,.5,1) .05s}
.ach.torn2 .bigt .t-stub{transform:translate(38px,26px) rotate(14deg)}
.ach.torn2 .bigt .t-main{clip-path:polygon(0 0,100% 0,97% 6%,100% 12%,97% 18%,100% 24%,97% 30%,100% 36%,97% 42%,100% 48%,97% 54%,100% 60%,97% 66%,100% 72%,97% 78%,100% 84%,97% 90%,100% 96%,100% 100%,0 100%)}
.ach.torn2 .bigt .t-stub{clip-path:polygon(4% 0,100% 0,100% 100%,4% 100%,0 96%,4% 90%,0 84%,4% 78%,0 72%,4% 66%,0 60%,4% 54%,0 48%,4% 42%,0 36%,4% 30%,0 24%,4% 18%,0 12%,4% 6%)}
.ach.torn2 .bigt .perf{display:none}
.slam{position:absolute;left:42%;top:55%;z-index:3;font:40px/1 'Kelly Slab';letter-spacing:.14em;color:var(--red2);border:5px double var(--red2);padding:10px 22px 8px;background:rgba(238,224,193,.12);
  transform:translate(-50%,-50%) scale(4) rotate(-14deg);opacity:0;pointer-events:none;text-shadow:0 0 1px var(--red2);mix-blend-mode:multiply}
.ach.stamped .slam{animation:slam .28s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes slam{to{transform:translate(-50%,-50%) scale(1) rotate(-14deg);opacity:.92}}
.ach.shake .stage{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px) rotate(-1deg)}40%{transform:translate(7px,-5px) rotate(1deg)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
.splat{position:absolute;left:42%;top:55%;z-index:2;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(194,39,44,.35) 0 20%,transparent 21%),radial-gradient(circle at 20% 30%,rgba(194,39,44,.5) 0 5%,transparent 6%),radial-gradient(circle at 80% 70%,rgba(194,39,44,.5) 0 4%,transparent 5%),radial-gradient(circle at 70% 20%,rgba(194,39,44,.4) 0 3%,transparent 4%)}
.ach.stamped .splat{animation:splat .5s ease-out forwards}
@keyframes splat{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.3)}}
.banner{text-align:center;transform:translateY(30px);opacity:0}

.badge{display:inline-flex;align-items:center;gap:14px;margin-top:16px;padding:12px 18px 12px 12px;background:linear-gradient(180deg,#3a2419,#221410);border:2px solid var(--gold);border-radius:12px;text-align:left;transform:scale(.6);opacity:0}
.ach.reward2 .badge{animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{to{transform:none;opacity:1}}
.medal{width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;font:26px 'Yeseva One',serif;color:#3a0709;
  background:radial-gradient(circle at 35% 30%,#fff3c9,var(--gold2) 40%,var(--gold) 70%,#8a6320);box-shadow:0 0 0 3px #5a0d11,0 0 24px rgba(233,199,124,.6)}
.badge .bt{font:13px 'Kelly Slab';letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.badge .bn{font:22px/1.1 'Yeseva One',serif;color:var(--bone)}
.badge .bd{font-size:13px;color:var(--muted)}
.prog{width:min(360px,80vw);margin:16px auto 0;opacity:0}
.ach.reward2 .prog{animation:up .4s .25s forwards}
.prog .bar{height:10px;border-radius:6px;background:#2a1b14;border:1px solid #5a3a28;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--red2) 0 10px,var(--bone) 10px 20px);transition:width 1s cubic-bezier(.2,1,.3,1) .4s}
.prog .pl{display:flex;justify-content:space-between;font:12px 'Kelly Slab';color:var(--muted);margin-top:4px}
.ach .next{margin-top:18px;opacity:0}

.conf{position:absolute;top:50%;left:50%;pointer-events:none;will-change:transform}

.letters{grid-column:1/-1;margin-top:4px;padding-top:16px;border-top:2px dashed rgba(107,74,58,.5)}

.envs{display:flex;gap:26px;flex-wrap:wrap}
.env{position:relative;width:230px;height:146px;cursor:pointer;border:0;padding:0;background:none;transition:transform .2s;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}

.env .e-back{position:absolute;inset:0;border-radius:4px;background:linear-gradient(160deg,#6e1016,#3d070a)}

  font:24px 'Yeseva One',serif;color:#3a0709;border-radius:47% 53% 50% 50% / 52% 48% 52% 48%;
  background:radial-gradient(circle at 35% 30%,#f7dc98,var(--gold) 45%,#8a6320 80%);box-shadow:0 0 0 3px rgba(122,85,24,.6),0 3px 6px rgba(0,0,0,.5),inset 0 0 8px rgba(0,0,0,.35)}
.env .e-name{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:13px 'Kelly Slab';letter-spacing:.1em;color:var(--paper2)}

.env.empty:hover{transform:none}

dialog.lt{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border:0;color:inherit;display:none;place-items:center;background:rgba(5,4,3,.9);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);overflow:auto;padding:20px}
dialog.lt[open]{display:grid}
dialog.lt::backdrop{background:transparent}
.benv{position:relative;width:min(380px,86vw);height:min(240px,55vw);perspective:900px;transition:opacity .4s,transform .4s}
.benv .back{position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,#6e1016,#3d070a);z-index:1}
.benv .paper{position:absolute;left:6%;right:6%;top:8%;height:84%;z-index:2;border-radius:3px;background:linear-gradient(135deg,var(--paper),var(--paper2));transition:transform .7s cubic-bezier(.3,1.2,.4,1)}
.benv .paper::before{content:"";position:absolute;left:14%;right:14%;top:22%;height:50%;background:repeating-linear-gradient(180deg,rgba(107,74,58,.35) 0 2px,transparent 2px 14px)}
.benv .pocket{position:absolute;inset:0;z-index:3;border-radius:6px;background:linear-gradient(200deg,#5c0c11,#34060a);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.benv .flap{position:absolute;inset:0;z-index:4;background:linear-gradient(180deg,#8a161c,#5e0c11);clip-path:polygon(0 0,100% 0,50% 60%);transform-origin:50% 0;transition:transform .55s ease-in;border-radius:6px}
.benv .seal{z-index:5;width:70px;height:70px;margin:-35px 0 0 -35px;font-size:32px;background:none!important;box-shadow:none!important}
.benv .seal i{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 35% 30%,#f7dc98,#c8963e 45%,#8a6320 80%);box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 0 8px rgba(0,0,0,.35);color:#3a0709;display:grid;place-items:center;font-style:normal;transition:transform .45s ease-out,opacity .45s}
.benv .seal i:first-child{clip-path:polygon(0 0,55% 0,40% 45%,58% 60%,45% 100%,0 100%)}
.benv .seal i:last-child{clip-path:polygon(55% 0,100% 0,100% 100%,45% 100%,58% 60%,40% 45%)}
.lt.crack .seal i:first-child{transform:translate(-40px,30px) rotate(-35deg);opacity:0}
.lt.crack .seal i:last-child{transform:translate(40px,34px) rotate(30deg);opacity:0}
.lt.flap .flap{transform:rotateX(180deg);z-index:0}
.lt.slide .paper{transform:translateY(-62%)}
.lt.read .benv{opacity:0;transform:scale(.8) translateY(60px);pointer-events:none;position:absolute}
.sheet{display:none;position:relative;width:min(640px,92vw);max-height:84vh;overflow:auto;padding:40px 40px 30px;color:var(--ink);border-radius:4px;
  background:radial-gradient(200px 120px at 90% 95%,rgba(120,70,30,.22),transparent 70%),radial-gradient(160px 100px at 8% 6%,rgba(120,70,30,.15),transparent 70%),linear-gradient(135deg,#f3e6c8,#dcc69a);
  box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 0 60px rgba(120,70,30,.25);transform:translateY(40px) scale(.9);opacity:0;transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .35s}

/* ---------- афиша: стена с плакатами ---------- */
.af-wall{position:relative;padding:34px 22px 30px;border-radius:8px;border:3px solid #4a2e20;
  background:linear-gradient(180deg,rgba(255,200,120,.10),transparent 35%),repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 2px,transparent 2px 120px),repeating-linear-gradient(90deg,#33201a 0 60px,#2d1c16 60px 120px);
  box-shadow:inset 0 0 60px rgba(0,0,0,.7),0 20px 40px rgba(0,0,0,.5)}
.af-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:40px 28px}
.af-slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.af-poster{position:relative;width:100%;aspect-ratio:3/5;container-type:inline-size;overflow:hidden;cursor:pointer;border:0;padding:0;font:inherit;
  color:var(--pi);background:var(--pb);transform:rotate(var(--r,0deg));box-shadow:0 14px 26px rgba(0,0,0,.6),inset 0 0 40px rgba(60,30,10,.35)}
.af-poster:focus-visible{outline:3px solid var(--gold2);outline-offset:4px}

.af-poster::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;mix-blend-mode:multiply;
  background:radial-gradient(70px 50px at 82% 92%,rgba(90,50,20,.30),transparent 70%),radial-gradient(90px 60px at 12% 6%,rgba(90,50,20,.22),transparent 70%)}
.af-poster::after{content:"";position:absolute;inset:3.5%;border:2px solid var(--pf);outline:1px solid var(--pf);outline-offset:-6px;pointer-events:none;z-index:3}
.af-tape{position:absolute;width:28%;height:6%;background:rgba(238,224,193,.55);z-index:5;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.af-tape.l{left:-6%;top:1.5%;transform:rotate(-38deg)} .af-tape.r{right:-6%;top:1.5%;transform:rotate(38deg)}
.af-rays{position:absolute;left:50%;top:38%;width:170%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:0;
  background:repeating-conic-gradient(var(--pr) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);opacity:.55}
.af-in{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:9% 9% 7%}
.af-top{font:6cqw/1 'Kelly Slab';letter-spacing:.2em;text-transform:uppercase}
.af-pic{flex:none;width:68%;aspect-ratio:2/3;margin:5% 0 4%;background:#1a1210 center/cover no-repeat;box-shadow:0 0 0 3px var(--pf),0 0 0 6px var(--pb),0 0 0 7px var(--pf),0 8px 16px rgba(0,0,0,.45);filter:sepia(.12) contrast(1.03)}

.af-poster.horror .af-title{font-family:'Rubik Wet Paint',cursive;font-size:8cqw}
.af-genre{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font:5.2cqw/1.2 'Kelly Slab';letter-spacing:.12em;text-transform:uppercase;margin:3% 0 5%;opacity:.85}
.af-ribbon{flex:none;align-self:stretch;margin:0 -4%;padding:4% 2% 3.4%;background:var(--pf);color:var(--pb);font:7cqw/1 'Kelly Slab';letter-spacing:.1em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.af-ribbon b{font-weight:400;font-family:'Yeseva One',serif;letter-spacing:.04em}

  background:radial-gradient(circle at 35% 30%,#d8434a,var(--red2) 45%,#6e0f13);box-shadow:0 0 0 3px #5a0d11,0 4px 10px rgba(0,0,0,.6);outline:1.5px dashed rgba(244,235,217,.6);outline-offset:-8px;pointer-events:none}

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL = 'https://blzdhvctwrkamvayylrr.supabase.co', SB_KEY = 'sb_publishable_YjNiD8hhkHcfRe6wcugaHg_iPNf4ieP';
const sb = createClient(SB_URL, SB_KEY);

const P = id => 'https://st.kp.yandex.net/images/film_iphone/iphone360_' + id + '.jpg';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const serial = id => '№ ' + String(id).padStart(7,'0');
const ru = d => d ? d.split('-').reverse().join('.') : '';
const view = document.getElementById('view');
const nav = document.getElementById('nav');

let me = null, names = {}, meKey = 'v', films = [], tab = 'watched';
const F = { genre:null, rate:'all', who:'all', sort:'date' };
const seen = m => m.vs || m.ns;
const lastDate = m => [m.vd, m.nd].filter(Boolean).sort().pop();
const short = d => d ? d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(2,4) : '';
function dateLine(m){
  const a = m.vs && m.vd, b = m.ns && m.nd;
  if (a && b && a !== b) return `<div class="date">смотрели<b class="two">${esc(nameOf('v'))} ${short(a)}<br>${esc(nameOf('n'))} ${short(b)}</b></div>`;
  const one = a || b; return one ? `<div class="date">смотрели<b>${ru(one)}</b></div>` : '';
}
const lastTouch = m => [m.vu, m.nu].filter(Boolean).sort().pop() || '';
const nameOf = k => Object.entries(names).find(([id,n]) => (n === 'Ника' ? 'n' : 'v') === k)?.[1] || (k === 'n' ? 'Ника' : 'Вова');

// ---------- лампочки ----------
function bulbs(el, n){ for(let i=0;i<n;i++){ const b=document.createElement('i'); if(i%11===7) b.className='dead'; else if(i%7===3) b.className='fl'; b.style.animationDelay=(i*0.37%3)+'s'; el.appendChild(b);} }
bulbs(document.getElementById('garland'), Math.round(innerWidth/34));
document.querySelectorAll('#sign .row').forEach(r => { for(let i=0;i<11;i++){ const b=document.createElement('span'); b.className='bulb'+(i===4?' fl':'')+(i===8&&r.classList.contains('bot')?' dead':''); b.style.animationDelay=(i*.5)+'s'; r.appendChild(b);} });

// ---------- данные ----------
async function load(){
  const [a, b] = await Promise.all([sb.from('movies').select('*, reviews(*)'), sb.from('watchlist').select('*')]);
  if (a.error) throw a.error; if (b.error) throw b.error;
  const wl = Object.fromEntries(b.data.map(w => [w.kp_id, w]));
  films = a.data.map(m => {
    const f = { id:m.kp_id, t:m.title, o:m.title_orig || '', y:m.year || '', g:m.genres || [], poster:m.poster_url, desc:m.description, kp:m.kp_rating, created:m.created_at };
    for (const r of m.reviews){ const k = names[r.user_id] === 'Ника' ? 'n' : 'v'; f[k+'s']=true; f[k]=r.rating; f[k+'d']=r.watched_at; f[k+'r']=r.review; f[k+'u']=r.updated_at; }
    if (wl[m.kp_id]) f.want = names[wl[m.kp_id].added_by] || 'кто-то';
    return f;
  });
  document.getElementById('cW').textContent = films.filter(seen).length;
  document.getElementById('cH').textContent = films.filter(m => m.want).length;
}
function fromKp(d){
  return { id:d.id, t:d.name || d.alternativeName || d.enName || 'Без названия', o:d.alternativeName || d.enName || '', y:d.year || '',
    g:(d.genres||[]).map(x=>x.name), poster:d.poster?.previewUrl || d.poster?.url || null, desc:d.description || d.shortDescription || null,
    kp:d.rating?.kp || null, raw:d, fresh:true };
}
async function saveMovie(f){
  const row = { kp_id:f.id, title:f.t, title_orig:f.o || null, year:f.y || null, poster_url:f.poster || P(f.id), genres:f.g, description:f.desc, kp_rating:f.kp };
  if (f.raw) row.raw = f.raw;
  const { error } = await sb.from('movies').upsert(row);
  if (error) throw error;
}
// дотягиваем жанры и описание с Кинопоиска для фильмов, где их нет
async function enrich(f){
  const { data, error } = await sb.functions.invoke('kp', { body:{ action:'movie', id:f.id } });
  if (error || !data || data.error) return false;
  const k = fromKp(data);
  const upd = { genres:k.g, description:k.desc, kp_rating:k.kp, raw:data };
  if (!f.o && k.o) upd.title_orig = k.o;
  await sb.from('movies').update(upd).eq('kp_id', f.id);
  Object.assign(f, { g:k.g, desc:k.desc, kp:k.kp, o:f.o || k.o });
  return true;
}
let enriching = false;
async function enrichAll(){
  if (enriching) return; enriching = true;
  let tried = {}; try { tried = JSON.parse(sessionStorage.getItem('kpTried') || '{}'); } catch(e){}
  const queue = films.filter(f => !f.g.length && !f.desc && !tried[f.id]).slice(0, 60);
  let changed = 0;
  for (const f of queue){
    tried[f.id] = 1; try { sessionStorage.setItem('kpTried', JSON.stringify(tried)); } catch(e){}
    if (await enrich(f)) changed++;
    await new Promise(r => setTimeout(r, 250));
  }
  enriching = false;
  if (changed && !document.getElementById('dlg').open && !document.getElementById('ach').classList.contains('show')) render();
}

// ---------- билеты ----------
const stamp = (val, who, cls) => `<div class="stamp ${cls}">${val ?? '—'}<small>${who}</small></div>`;
function ticketHTML(m, mode){
  const torn = mode === 'torn';
  const stub = torn
    ? `<div class="stamps">${m.vs?stamp(m.v,nameOf('v'),'v'):''}${m.ns?stamp(m.n,nameOf('n'),'n'):''}</div>${dateLine(m)}${(m.vr||m.nr)?'<div class="mini-seal" title="есть письмо">✉&#xFE0E;</div>':''}`
    : `<div class="void">Ещё не<br>использован</div>`;
  const meta = [m.y, m.g.slice(0,3).join(', ') || m.o].filter(Boolean).join(' · ');
  const foot = mode === 'search'
    ? `<div class="actions"><button class="btn" data-act="seen">Смотрели</button>${m.want?'':'<button class="btn ghost" data-act="want">Хочу</button>'}</div>`
    : `<div class="foot"><span>${serial(m.id)}</span>${m.want && !torn ? `<span>добавил(а): ${esc(m.want)}</span>` : ''}</div>`;
  return `<div class="ticket ${torn?'torn':''}" data-id="${m.id}">
    <div class="t-main"><div class="poster" style="background-image:url('${esc(m.poster || P(m.id))}')"></div>
      <div class="t-body"><div class="kick">Допуск на двоих</div><div class="title">${esc(m.t)}</div><div class="meta">${esc(meta)}</div>${foot}</div>
      ${torn?'<div class="used">погашен</div>':'<div class="perf"></div>'}</div>
    <div class="t-stub">${stub}</div></div>`;
}

// ---------- фильтры ----------
const RATES = [['all','любая'],['9','9–10'],['7','7–8'],['5','5–6'],['1','1–4']];
const inRate = (x, r) => x && (r==='9'?x>=9:r==='7'?x>=7&&x<=8:r==='5'?x>=5&&x<=6:x<=4);
function pass(m){
  if (F.genre && !m.g.includes(F.genre)) return false;
  if (tab === 'watched'){
    if (F.who==='both' && !(m.vs&&m.ns)) return false;
    if (F.who==='v' && !(m.vs&&!m.ns)) return false;
    if (F.who==='n' && !(m.ns&&!m.vs)) return false;
    if (F.rate!=='all' && !inRate(m.v,F.rate) && !inRate(m.n,F.rate)) return false;
  }
  return true;
}
function filtersHTML(list){
  const g = {}; list.forEach(m => m.g.forEach(x => g[x]=(g[x]||0)+1));
  const genres = Object.entries(g).sort((a,b)=>b[1]-a[1]);
  const chip = (k,label,on,extra='') => `<button class="chip ${on?'on':''}" ${k}>${label}${extra}</button>`;
  let h = `<div class="filters">`;
  if (genres.length) h += `<div class="frow"><span class="fl">Жанр</span>${chip('data-g=""','все',!F.genre)}${genres.map(([x,c])=>chip(`data-g="${esc(x)}"`,esc(x),F.genre===x,`<small>${c}</small>`)).join('')}</div>`;
  if (tab === 'watched') h += `
    <div class="frow"><span class="fl">Оценка</span>${RATES.map(([k,l])=>chip(`data-r="${k}"`,l,F.rate===k)).join('')}</div>
    <div class="frow"><span class="fl">Смотрели</span>${[['all','все'],['both','вдвоём'],['v','только '+nameOf('v')],['n','только '+nameOf('n')]].map(([k,l])=>chip(`data-w="${k}"`,l,F.who===k)).join('')}<span class="fcount" id="fcount"></span></div>`;
  return h === `<div class="filters">` ? '' : h + `</div>`;
}
function bindFilters(){
  view.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{F.genre=b.dataset.g||null;render();});
  view.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{F.rate=b.dataset.r;render();});
  view.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{F.who=b.dataset.w;render();});
  view.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{F.sort=b.dataset.s;render();});
}

// ---------- экраны ----------
const closedBoard = (t) => `<div class="closed"><div class="board"><b>Закрыто</b><span>${t}</span></div></div>`;
function showWatched(){
  const all = films.filter(seen);
  if (!all.length){ view.innerHTML = closedBoard('Погашенных билетов пока нет. Загляните в кассу'); return; }
  let list = all.filter(pass);
  const avg = m => (m.v&&m.n) ? (m.v+m.n)/2 : (m.v||m.n||0);
  if (F.sort==='date') list.sort((a,b)=>(lastDate(b)||'').localeCompare(lastDate(a)||'') || lastTouch(b).localeCompare(lastTouch(a)));
  if (F.sort==='rate') list.sort((a,b)=>avg(b)-avg(a));

async function saveAlias(key, m){

function kpOf(f){
  if (f.m !== undefined) return f.m;
  const k = f.key || normT(f.t);
  if (aliases[k]) return aliases[k].kp_id ? aliasMovie(aliases[k]) : null; // 0 — это и правда российский фильм
  if (f.bundle) return null; // название российского фильма, по нему искать нельзя

const kpFound = {};
async function resolveKp(f){
  const have = kpOf(f); if (have) return have;
  if ((f.keys || [f.key]).some(k => aliases[k] && !aliases[k].kp_id)) return null;
  const { data, error } = await sb.functions.invoke('kp', { body:{ action:'search', query:f.t } });
  if (error || data?.error) throw new Error(error?.message || data.error);
  const docs = data.docs || [];
  // одноимённых фильмов бывает много («Психопатка» 2007, 2019, 2026…): берём год из кинотеатра, иначе самый свежий
  const curY = new Date().getFullYear();
  const key = f.keys?.[0] || f.key;
  const exact = docs.filter(d => [d.name, d.alternativeName, d.enName].some(n => n && normT(n) === key) && (!d.year || d.year <= curY + 1));
  exact.sort((a, b) => (b.year || 0) - (a.year || 0));
  const d = (f.year && exact.find(x => x.year === f.year)) || exact[0] || docs[0];
  if (!d) return null;
  const m = films.find(x => x.id === d.id) || fromKp(d);
  kpFound[key] = m; return m;
}

    const m = kpOf(f), gk = m ? 'kp' + m.id : f.key;

    if (!g){ out.set(gk, { ...f, key:gk, keys:[f.key], m, t:m && (aliases[f.key] || f.bundle) ? m.t : f.t, as:aliases[f.key] ? [f.t] : [], bundle:f.bundle && !m && !aliases[f.key], shows:[...f.shows] }); continue; }
    g.keys.push(f.key); g.shows.push(...f.shows); g.shows.sort((x, y) => x.at.localeCompare(y.at));
    if (aliases[f.key]) g.as.push(f.t);
    if (!g.trailer || f.shows[0]?.c === 'mc' && f.trailer) g.trailer = f.trailer || g.trailer;

const pcol = (() => { try { return JSON.parse(localStorage.getItem('pcol2') || '{}'); } catch(e){ return {}; } })();
const savePcol = () => { try { const k = Object.keys(pcol); if (k.length > 600) k.slice(0, k.length - 600).forEach(x => delete pcol[x]); localStorage.setItem('pcol2', JSON.stringify(pcol)); } catch(e){} };
function rgb2hsl(r, g, b){ r/=255; g/=255; b/=255; const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2; if (mx === mn) return [0,0,l];
  const d = mx-mn, s = l > .5 ? d/(2-mx-mn) : d/(mx+mn); const h = mx === r ? ((g-b)/d + (g < b ? 6 : 0)) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4; return [h/6, s, l]; }
// главный цвет постера: самый «весомый» насыщенный оттенок, у серых постеров — классическая тёмная гамма
function posterTones(px){
  const bins = Array.from({ length:12 }, () => ({ w:0, s:0, h:0 })); let n = 0;
  for (let i = 0; i < px.length; i += 4){
    const [h, s, l] = rgb2hsl(px[i], px[i+1], px[i+2]); n++;
    if (s < .22 || l < .1 || l > .9) continue;
    const b = bins[Math.floor(h*12) % 12], w = s * (1 - Math.abs(l - .5));
    b.w += w; b.s += s*w; b.h += h*w;
  }
  const best = bins.reduce((a, b) => b.w > a.w ? b : a);
  // почти бесцветный постер (чёрно-белый, тёмный хоррор) — классический «ночной» плакат с золотом
  if (best.w < n * .04) return { pb:'#16100d', pi:'#e9c77c', pf:'#c8963e', pr:'rgba(200,150,62,.28)' };
  const h = Math.round(best.h / best.w * 360), s = Math.min(70, Math.round(best.s / best.w * 100));
  return { pb:`hsl(${h} ${Math.max(28, s - 10)}% 17%)`, pi:'#f4ebd9', pf:`hsl(${h} ${Math.min(65, s + 5)}% 72%)`, pr:`hsl(${h} ${s}% 60% / .32)` };
}
async function readPixels(src, W = 24, H = 36){

const applyTones = (el, t) => { if (!t) return; for (const k of ['pb','pi','pf','pr']) el.style.setProperty('--' + k, t[k]); el.classList.add('tinted'); };
async function tintPosters(root){
  const jobs = [...root.querySelectorAll('.af-poster')].map(el => [el, (el.querySelector('.af-pic')?.style.backgroundImage || '').slice(5, -2)]).filter(([, u]) => u);
  const todo = [];
  for (const [el, u] of jobs){ if (u in pcol) applyTones(el, pcol[u]); else todo.push([el, u]); }
  let i = 0;

}

// полные данные с Кинопоиска храним в браузере 7 дней, чтобы повторное открытие карточки не тратило лимит
async function loadFull(m){
  const key = 'kpf2' + m.id;
  try { const c = JSON.parse(localStorage.getItem(key) || 'null'); if (c && Date.now() - c.at < 7*864e5) return c.v; } catch(e){}
  const { data, error } = await sb.functions.invoke('kp', { body:{ action:'movie', id:m.id } });
  if (error || !data || data.error) return null;
  const P_ = (data.persons || []);
  const v = { len:data.movieLength || null, age:data.ageRating ?? null, countries:(data.countries || []).map(x => x.name),
    imdb:data.rating?.imdb || null, critics:data.rating?.filmCritics || null, slogan:data.slogan || null,
    desc:data.description || data.shortDescription || null, year:data.year || null, o:data.alternativeName || data.enName || '',
    directors:P_.filter(p => p.enProfession === 'director').map(p => p.name || p.enName).filter(Boolean).slice(0,3),
    actors:P_.filter(p => p.enProfession === 'actor' && (p.name || p.enName)).slice(0,6).map(p => ({ n:p.name || p.enName, ph:p.photo || null })),
    watch:(data.watchability?.items || []).filter(w => w.url).map(w => ({ n:w.name, u:w.url, logo:w.logo?.url || null })),
    budget:data.budget?.value ? data.budget : null, fees:data.fees || null, backdrop:data.backdrop?.url || null };
  try { localStorage.setItem(key, JSON.stringify({ at:Date.now(), v })); } catch(e){}
  return v;
}

const runtime = n => n ? (n >= 60 ? `${Math.floor(n/60)} ч${n % 60 ? ' ' + (n % 60) + ' мин' : ''}` : n + ' мин') : '';

const MILES = [10,25,50,75,100,150,200,300,500];
function snapshot(){ return { total: films.filter(seen).length, horror: films.filter(m=>seen(m)&&m.g.includes('ужасы')).length }; }
function pickAchievement(m, before){
  const now = snapshot();
  const hit = MILES.find(x => before.total < x && now.total >= x);
  if (hit) return {icon:hit, t:'Коллекционеры', d:`${hit} погашенных билетов`};
  if (m.v && m.n && m.v === m.n) return {icon:'=', t:'Одна волна', d:'Поставили одинаковые оценки'};
  if (m.v && m.n && Math.abs(m.v - m.n) >= 5) return {icon:'!', t:'Спор века', d:`Разошлись на ${Math.abs(m.v-m.n)} баллов`};
  const hm = [5,10,25,50].find(x => before.horror < x && now.horror >= x);
  if (hm) return {icon:hm, t:'Не из пугливых', d:`${hm} ужастиков позади`};
  if (m[meKey] === 10) return {icon:'10', t:'Шедевр', d:'Высшая оценка'};
  if (m[meKey] === 1) return {icon:'1', t:'Больше никогда', d:'Худшая оценка в коллекции'};
  return null;
}
function playSound(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)(); const t = ac.currentTime;
    const thud = ac.createOscillator(), g = ac.createGain(); thud.type='triangle'; thud.frequency.setValueAtTime(140,t+.55); thud.frequency.exponentialRampToValueAtTime(40,t+.75);
    g.gain.setValueAtTime(0,t); g.gain.setValueAtTime(.5,t+.55); g.gain.exponentialRampToValueAtTime(.001,t+.85); thud.connect(g).connect(ac.destination); thud.start(t+.5); thud.stop(t+.9);
    [659,784,988,1319].forEach((f,i)=>{ const o=ac.createOscillator(), gg=ac.createGain(); o.type='square'; o.frequency.value=f; const st=t+1.05+i*.09;
      gg.gain.setValueAtTime(0,st); gg.gain.linearRampToValueAtTime(.06,st+.01); gg.gain.exponentialRampToValueAtTime(.001,st+.35); o.connect(gg).connect(ac.destination); o.start(st); o.stop(st+.4); });
  }catch(e){}
}
function confetti(stage){
  const kinds = ['tk','tk','st','st','dot','bt2'];
  for (let i=0;i<70;i++){
    const c = document.createElement('div'); c.className = 'conf ' + kinds[i%kinds.length];
    const ang = Math.random()*Math.PI*2, dist = 180 + Math.random()*420, dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 120;
    c.animate([{transform:'translate(-50%,-50%) scale(.3) rotate(0)',opacity:1},
               {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*720-360}deg)`,opacity:1,offset:.55},
               {transform:`translate(${dx*1.1}px,${dy+320}px) rotate(${Math.random()*900}deg)`,opacity:0}],
              {duration:1800+Math.random()*900,easing:'cubic-bezier(.15,.8,.3,1)',fill:'forwards'});
    stage.appendChild(c); setTimeout(()=>c.remove(), 3000);
  }
}

  setTimeout(()=>{ ach.classList.add('reward2'); bar.style.transition=''; bar.style.width = ((now.total-prev)/(next-prev||1)*100)+'%'; }, 1500);
}
document.getElementById('achNext').onclick = () => { ach.className = 'ach'; };
ach.addEventListener('click', e => { if (e.target === ach) ach.className = 'ach'; });

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }

document.querySelectorAll('.plank[data-t]').forEach(p => p.onclick = () => {
  document.querySelectorAll('.plank[data-t]').forEach(x => x.classList.toggle('on', x===p)); tab = p.dataset.t; F.genre=null; F.rate='all'; F.who='all'; render();
});
document.getElementById('out').onclick = () => sb.auth.signOut();

// ---------- старт ----------
async function start(session){
  if (!session){ me = null; return renderLogin(); }
  if (me?.id === session.user.id) return;
  me = session.user;
  const { data } = await sb.from('profiles').select('*');
  names = Object.fromEntries((data || []).map(p => [p.id, p.name]));
  meKey = names[me.id] === 'Ника' ? 'n' : 'v';
  nav.style.display = '';
  view.innerHTML = '<div class="nores">Открываем ворота…</div>';
  try { await load(); render(); enrichAll(); }
  catch(err){ view.innerHTML = `<div class="nores">Ошибка: ${esc(err.message)}</div>`; }
}
sb.auth.onAuthStateChange((_e, session) => { setTimeout(() => start(session), 0); });
</script>
